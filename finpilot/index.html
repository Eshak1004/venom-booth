<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinPilot – Offline</title>
<style>
:root{--bg:#f4f5f9;--cd:#fff;--tx:#161a23;--mu:#6b7385;--bd:#e2e5ee;--ac:#4f46e5;--gn:#16a34a;--rd:#dc2626;--am:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--cd:#171b25;--tx:#e8ebf2;--mu:#8b93a7;--bd:#262c3a;--ac:#8b85ff}}
:root[data-theme="dark"]{--bg:#0e1118;--cd:#171b25;--tx:#e8ebf2;--mu:#8b93a7;--bd:#262c3a;--ac:#8b85ff}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1}h2{font-size:15px;margin:0 0 10px}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 16px 8px}
nav button{border:0;background:none;color:var(--mu);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac);color:#fff}
main{padding:0 16px 40px;max-width:1100px;margin:auto}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:12px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;min-width:0}
.k small{color:var(--mu);display:block}.k b{font-size:21px}
.gn{color:var(--gn)}.rd{color:var(--rd)}.am{color:var(--am)}.mu{color:var(--mu)}
input,select,button.b,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px}
button.b{cursor:pointer;background:var(--ac);color:#fff;border:0}button.b.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.b.d{background:var(--rd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.row>*{flex:1 1 120px}.row>button{flex:0 0 auto}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mu);font-weight:500}
.sc{overflow-x:auto}td.r,th.r{text-align:right}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%}
.al{padding:8px 12px;border-radius:10px;margin-bottom:8px;background:color-mix(in srgb,var(--am) 15%,var(--cd));border:1px solid var(--am)}
.al.r{background:color-mix(in srgb,var(--rd) 13%,var(--cd));border-color:var(--rd)}
.dn{width:140px;height:140px;border-radius:50%;flex:none}.dn i{display:block;margin:28px;width:84px;height:84px;border-radius:50%;background:var(--cd)}
.bars{display:flex;gap:10px;align-items:flex-end;height:140px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars span{display:inline-block;width:42%;margin:0 1px;border-radius:3px 3px 0 0;vertical-align:bottom}
.ai{white-space:normal;background:var(--bg);border-radius:10px;padding:12px;margin-top:10px;min-height:50px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;display:none;z-index:9}
.tag{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--bd);color:var(--mu)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{backdrop-filter:blur(10px)}
</style></head><body>
<!-- Remaining application markup and scripts are included in the original repository file. -->
<div id="app"></div>
</body></html>
